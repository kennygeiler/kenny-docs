  # ------------------------------------------------------------------------------
  # M1 FULL RULEBOOK (2026-10-28). One known answer per Local 3535 rule drafted in the
  # M1 pass (rules_proposed.json, status proposed). Values were read off the page
  # images, not only the OCR text. They read as PENDING until the owner approves the
  # rules by contract section; each one is the rule's `_scenario`, so the gate (R3/R4)
  # needs it to pass. `topic` restricts the check to that topic's base rules, the way
  # chat routes a question to one pay type or one entitlement.
  # Local 3535 MOU VII. Wages and Hours (p.6): the hourly rate of a 56-hour employee is the
  # annual salary / 2920; Appendix A (p.35) prints $53.40 for Firefighter/Paramedic III.
  # Regular hours carry no multiplier.
  #   53.40 x 8h = 427.20
  - name: "8-hour regular shift at the hourly rate, Firefighter/Paramedic top step (Local 3535 VII p.6)"
    source: "analyst-derived: hourly rate definition Local 3535 MOU VII p.6; $53.40/hr Firefighter/Paramedic III, Appendix A p.35 / Master Salary Schedule"
    assumptions:
      - "Hours are regular scheduled hours, not overtime, holiday or out-of-class hours"
